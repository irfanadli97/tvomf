plugins {
	id 'fabric-loom' version "${loom_version}"
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tvomf" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// In-game visual tests: `gradlew runClientGameTest` starts a client, creates a world and writes
// screenshots. Mods dropped in build/run/clientGameTest/mods are loaded alongside.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "tvomf-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = false
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.x is obfuscated; the code is written against Mojang's own names.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional at runtime: the settings screen needs both, the rest of the mod needs neither.
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") { transitive = false }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

	from("CREDITS.md") {
		rename { "CREDITS_${projectName}.md" }
	}
}
