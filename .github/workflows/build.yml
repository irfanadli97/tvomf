# Builds the mod on every push and pull request, so a change that no longer compiles shows up at
# once, and keeps the jar as a downloadable artifact.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: tvomf
          path: build/libs/*.jar
          if-no-files-found: error
